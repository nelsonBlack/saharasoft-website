name: Patch Caddy (one-off — www redirect + security headers for saharasoft.org)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SERVER_IP
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Show current saharasoft.org block
        run: |
          ssh vps 'CADDY=$(docker ps -qf "name=caddy_prod"); docker exec "$CADDY" awk "/^saharasoft.org/{f=1} f{print} f&&/^}/{exit}" /etc/caddy/Caddyfile'

      - name: Patch Caddyfile (backup, patch, validate, reload-or-rollback)
        run: |
          ssh vps 'set -e
            CADDY=$(docker ps -qf "name=caddy_prod")
            CONF=$(docker inspect "$CADDY" --format "{{range .Mounts}}{{if eq .Destination \"/etc/caddy/Caddyfile\"}}{{.Source}}{{end}}{{end}}")
            echo "Live config source: $CONF"
            cp "$CONF" "$CONF.bak.20260828-seo"
            python3 - <<PYEOF
import re

path = "'"$CONF"'"
s = open(path).read()

block_re = re.compile(r"(?ms)^(saharasoft\.org[^\n]*\{)\n(.*?)^\}")
m = block_re.search(s)
assert m, "saharasoft.org block not found"
if "Strict-Transport-Security" in m.group(2):
    print("already patched, nothing to do")
    raise SystemExit(0)

opener, body = m.group(1), m.group(2)
redir = "    @www host www.saharasoft.org\n    redir @www https://saharasoft.org{uri} permanent\n\n"
headers = (
    "\n    header {\n"
    "        Strict-Transport-Security \"max-age=31536000; includeSubDomains\"\n"
    "        X-Content-Type-Options \"nosniff\"\n"
    "        X-Frame-Options \"DENY\"\n"
    "        Referrer-Policy \"strict-origin-when-cross-origin\"\n"
    "        Permissions-Policy \"camera=(), microphone=(), geolocation=()\"\n"
    "        -Server\n"
    "    }\n"
)
patched = opener + "\n" + redir + body.rstrip("\n") + "\n" + headers + "}"
s = s[: m.start()] + patched + s[m.end():]
open(path, "w").write(s)
print("patched OK")
PYEOF
            if docker exec "$CADDY" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | grep -q "Valid configuration"; then
              docker exec "$CADDY" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && echo "RELOADED-OK"
            else
              echo "VALIDATION FAILED - rolling back"
              cp "$CONF.bak.20260828-seo" "$CONF"
              exit 1
            fi
          '

      - name: Verify from runner
        run: |
          set -euo pipefail
          sleep 2
          echo "www status (expect 308):"
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://www.saharasoft.org/
          echo "apex headers:"
          curl -sI https://saharasoft.org/ | grep -iE "HTTP|strict-transport|x-content-type|referrer" || true
