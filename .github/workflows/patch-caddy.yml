name: Patch Caddy (one-off — www redirect + security headers for saharasoft.org)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $SERVER_IP
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Show current saharasoft.org block
        run: |
          ssh vps 'CADDY=$(docker ps -qf "name=caddy_prod"); docker exec "$CADDY" awk "/^saharasoft.org/{f=1} f{print} f&&/^}/{exit}" /etc/caddy/Caddyfile'

      - name: Backup, patch, validate, reload-or-rollback
        run: |
          set -euo pipefail
          scp -q .github/scripts/patch_caddy.py vps:/tmp/patch_caddy.py
          ssh vps 'set -e
            CADDY=$(docker ps -qf "name=caddy_prod")
            CONF=$(docker inspect "$CADDY" --format "{{range .Mounts}}{{if eq .Destination \"/etc/caddy/Caddyfile\"}}{{.Source}}{{end}}{{end}}")
            echo "Live config source: $CONF"
            cp "$CONF" "$CONF.bak.20260828-seo"
            python3 /tmp/patch_caddy.py "$CONF"

            echo "=== inode-drift check: container view vs host file ==="
            echo -n "host file HSTS count: ";      grep -c "Strict-Transport-Security" "$CONF" || true
            echo -n "container view HSTS count: "; docker exec "$CADDY" grep -c "Strict-Transport-Security" /etc/caddy/Caddyfile || true

            IMAGE=$(docker inspect "$CADDY" --format "{{.Config.Image}}")
            echo "image: $IMAGE"
            docker cp "$CONF" "$CADDY:/tmp/patched-C"
            if docker exec "$CADDY" caddy validate --config /tmp/patched-C --adapter caddyfile 2>&1 | tail -2 | grep -q "Valid configuration"; then
              docker exec "$CADDY" rm -f /tmp/patched-C
              echo "host file valid — restarting container to re-resolve bind mount"
              docker restart "$CADDY" && echo RESTARTED
              sleep 4
            else
              echo "VALIDATION FAILED - full output:"
              docker exec "$CADDY" caddy validate --config /tmp/patched-C --adapter caddyfile 2>&1 | tail -5 || true
              docker exec "$CADDY" rm -f /tmp/patched-C
              echo "rolling back"
              cp "$CONF.bak.20260828-seo" "$CONF"
              exit 1
            fi
            rm -f /tmp/patch_caddy.py
          '

      - name: Verify from runner
        run: |
          set -euo pipefail
          sleep 2
          echo "www status (expect 308):"
          curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://www.saharasoft.org/
          echo "apex headers:"
          curl -sI https://saharasoft.org/ | grep -iE "HTTP|strict-transport|x-content-type|referrer" || true

      - name: On-box diagnostics
        run: |
          ssh vps 'echo "=== server public IP ==="; curl -s -m 5 ifconfig.me || echo unknown; echo
            echo "=== who owns 80/443 ==="; ss -tlnp | grep -E ":80 |:443 " || true
            echo "=== caddy containers ==="; docker ps --format "{{.Names}} {{.Ports}}" | grep -i caddy || true
            echo "=== local Host-based tests ==="
            echo -n "http www (expect 308): "; curl -s -o /dev/null -w "%{http_code}\n" -H "Host: www.saharasoft.org" http://127.0.0.1/
            echo -n "https apex HSTS (SNI-correct): "; curl -skI --resolve saharasoft.org:443:127.0.0.1 https://saharasoft.org/ | grep -i strict-transport || echo "MISSING"
            echo "=== live admin-api config: HSTS present? ==="; docker exec caddy_prod wget -qO- http://127.0.0.1:2019/config/ 2>/dev/null | grep -c "Strict-Transport-Security" || echo 0
            echo "=== live admin-api config: www redir present? ==="; docker exec caddy_prod wget -qO- http://127.0.0.1:2019/config/ 2>/dev/null | grep -c "www.saharasoft.org" || echo 0
            echo "=== patched block now ==="; CADDY=$(docker ps -qf "name=caddy_prod"); docker exec "$CADDY" awk "/^saharasoft.org/{f=1} f{print} f&&/^}/{exit}" /etc/caddy/Caddyfile'
