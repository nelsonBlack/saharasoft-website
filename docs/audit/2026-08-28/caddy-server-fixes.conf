# Caddy server fixes for saharasoft.org — apply on the VPS, then reload Caddy.
# These address two audit findings that cannot be fixed in the static HTML:
#   (1) https://www.saharasoft.org serves duplicate content instead of redirecting
#   (2) missing security headers

# ── Option A: if the site block uses a site address list ──────────────────────
# Replace:
#     saharasoft.org {
#         root * /var/www/saharasoft
#         file_server
#     }
# With:
#     saharasoft.org, www.saharasoft.org {
#         @www host www.saharasoft.org
#         redir @www https://saharasoft.org{uri} permanent
#
#         root * /var/www/saharasoft
#         file_server
#
#         # Security headers
#         header {
#             Strict-Transport-Security "max-age=31536000; includeSubDomains"
#             X-Content-Type-Options    "nosniff"
#             X-Frame-Options           "DENY"
#             Referrer-Policy           "strict-origin-when-cross-origin"
#             Permissions-Policy        "camera=(), microphone=(), geolocation=()"
#             -Server
#         }
#     }
#
# `permanent` issues a 308, preserving method and matching what the audit recommends.

# ── Option B: separate www block (simplest if you prefer) ─────────────────────
#     www.saharasoft.org {
#         redir https://saharasoft.org{uri} permanent
#     }
#     saharasoft.org {
#         root * /var/www/saharasoft
#         file_server
#         header {
#             Strict-Transport-Security "max-age=31536000; includeSubDomains"
#             X-Content-Type-Options    "nosniff"
#             X-Frame-Options           "DENY"
#             Referrer-Policy           "strict-origin-when-cross-origin"
#             Permissions-Policy        "camera=(), microphone=(), geolocation=()"
#             -Server
#         }
#     }

# After editing: validate with `caddy validate --config /etc/caddy/Caddyfile`
# then reload with `systemctl reload caddy`.
#
# Verify afterwards:
#   curl -sI https://www.saharasoft.org/ | head -3          -> expect 308 -> https://saharasoft.org/
#   curl -sI https://saharasoft.org/ | grep -i strict       -> expect HSTS header
