# Caddy server fixes for saharasoft.org — APPLIED 2026-08-28

Status: DONE. This file documents what was applied and the two operational
gotchas discovered while applying it.

## What was applied

To the `saharasoft.org, www.saharasoft.org, saharasoftsolutions.com, www.saharasoftsolutions.com`
site block in `/var/www/caddy-prod/Caddyfile` on the SERVING VPS:

```caddy
    @www host www.saharasoft.org
    redir @www https://saharasoft.org{uri} permanent   # emits 301 in caddy:latest

    header {
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        X-Content-Type-Options "nosniff"
        X-Frame-Options "DENY"
        Referrer-Policy "strict-origin-when-cross-origin"
        Permissions-Policy "camera=(), microphone=(), geolocation=()"
        -Server
    }
```

Backup: `/var/www/caddy-prod/Caddyfile.bak.20260828-seo` (on the serving VPS).

## Gotcha 1 — the site is served by a different VPS than the deploy-target box

- `saharasoft.org` + `www` DNS → the "vps-main" box (152.53.64.150), which runs
  `caddy_prod` (docker) and is the target of the GitHub Actions deploy (`SERVER_IP` secret).
- 194.13.81.150 ("deploy-target" SSH alias) also runs a `caddy_prod` with a
  `saharasoft.org` block, but it serves no apex traffic (staging subdomains live there).
  The same patch was applied there too; harmless.

## Gotcha 2 — single-file bind-mount inode drift

`edit + caddy reload` is NOT enough on these boxes: the Caddyfile is bind-mounted
as a single file, and after the host file is edited in place the container's view can
stay on the old inode — `caddy reload` then keeps loading the old config while
reporting success (admin API confirmed: file had HSTS, running config did not).

Working procedure (used via a one-off GitHub Actions workflow, since removed):
1. Backup the Caddyfile.
2. Patch the block (idempotent).
3. Validate the PATCHED file inside the real container:
   `docker cp <file> caddy_prod:/tmp/patched-C && docker exec caddy_prod caddy validate --config /tmp/patched-C --adapter caddyfile`
   (validating in a fresh throwaway container fails: the Caddyfile `import`s
   `/srv/.caddy/*.caddy` files that only exist in the real container's mounts;
   and the official caddy image needs `--entrypoint caddy`.)
4. `docker restart caddy_prod` — required to re-resolve the bind mount. Note: brief
   blip for ALL sites on that box (~1–2 s).

## Verify

```
curl -s -o /dev/null -w "%{http_code} -> %{redirect_url}\n" https://www.saharasoft.org/   # 301 -> https://saharasoft.org/
curl -sI https://saharasoft.org/ | grep -iE "strict-transport|x-content-type|x-frame|referrer|permissions"
```
